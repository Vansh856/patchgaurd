[build-system]

requires=["setuptools>=61.0"]
build-backend="setuptools.build_meta"

[project]

name="patchguard"
version="0.1.0"
description="Autonomous Runtime Defence & Auto-Remediation Engine"
readme="README.md"
requires-python=">=3.10"
dependencies = [ 
    "fastapi>=0.100.0", 
    "starlette>=0.27.0", 
    "uvicorn>=0.22.0", 
    "sqlparse>=0.4.4", 
    "PyGithub>=2.1.0", 
    "pytest>=7.4.0", 
    "pytest-asyncio>=0.21.0",
    "google-genai>=1.0.0", 
    ]


[project.scripts]
patchguard="patchguard.interfaces.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning",
]
testpaths=["tests"]
pythonpath=["src"]